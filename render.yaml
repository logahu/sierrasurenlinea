# Blueprint de Render: crea el backend como servicio web gratuito con Docker.
services:
  - type: web
    name: turamohoy-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/categorias
    autoDeploy: true
    envVars:
      # Acepta Cloudflare Pages (*.pages.dev) y el Worker (sierrasurenlinea.<cuenta>.workers.dev;
      # también el nombre anterior, turamohoy, mientras se hace el cambio),
      # incluidas sus vistas previas.
      # Si tu proyecto de Pages no se llama "turamohoy", cambia el nombre aquí.
      - key: CORS_ORIGINS
        value: http://localhost:4200,/https://([a-z0-9-]+\.)?turamohoy\.pages\.dev/,/https://([a-z0-9-]+-)?(sierrasurenlinea|turamohoy)\.[a-z0-9-]+\.workers\.dev/
      # Conexión a PostgreSQL (Neon). Los valores se capturan en el panel de Render
      # (Environment); no van en el repositorio. Ver DEPLOY.md, sección 2.1.
      - key: QUARKUS_DATASOURCE_JDBC_URL
        sync: false
      - key: QUARKUS_DATASOURCE_USERNAME
        sync: false
      - key: QUARKUS_DATASOURCE_PASSWORD
        sync: false
      # Panel de administración. JWT_SECRETO firma las sesiones: Render genera un valor
      # aleatorio. ADMIN_CORREO y ADMIN_CONTRASENA crean la cuenta del dueño la primera
      # vez que arranca (ver DEPLOY.md, sección Panel).
      - key: JWT_SECRETO
        generateValue: true
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_CONTRASENA
        sync: false
