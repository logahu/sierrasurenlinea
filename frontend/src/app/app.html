<header class="barra">
  <div class="contenedor fila">
    <a class="marca" routerLink="/">
      <svg viewBox="0 0 32 32" aria-hidden="true" width="30" height="30">
        <circle cx="23" cy="9" r="4" fill="var(--cempasuchil)" />
        <path d="M2 27 L12 11 L18 20 L22 15 L30 27 Z" fill="var(--follaje)" />
        <path d="M12 11 L15.5 16.5 L13 15.5 L11 17 L9 15.8 Z" fill="#fff" opacity=".85" />
      </svg>
      <span>Sierra Sur <em>en Línea</em></span>
    </a>
  </div>
  @if (negocios.value(); as lista) {
    <nav class="contenedor menu" aria-label="Negocios">
      @for (n of lista; track n.id) {
        <a [routerLink]="['/', n.slug]" routerLinkActive="activo" [style.--acento]="n.colorPrimario">{{ n.nombre }}</a>
      }
    </nav>
  }
</header>

<main class="contenedor">
  <router-outlet />
</main>

<footer class="pie">
  <div class="contenedor">© {{ anio }} Sierra Sur en Línea · Miahuatlán de Porfirio Díaz, Oax.</div>
</footer>
