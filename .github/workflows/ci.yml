name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        run: mvn -B verify
      # Las mismas pruebas contra un PostgreSQL real (Quarkus Dev Services lo levanta en Docker),
      # para asegurar que las migraciones de Flyway funcionan igual que en Neon.
      - name: Probar contra PostgreSQL
        run: mvn -B test -Dquarkus.test.profile=pg

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas
        run: npx ng test --watch=false
      - name: Build de producción
        run: npm run build
