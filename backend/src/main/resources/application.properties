# --- Base de datos -------------------------------------------------------
# Producción (Render): PostgreSQL en Neon. La conexión NO va en el repo; se
# define con variables de entorno en Render:
#   QUARKUS_DATASOURCE_JDBC_URL  = jdbc:postgresql://<host>/<base>?sslmode=require
#   QUARKUS_DATASOURCE_USERNAME  = <usuario>
#   QUARKUS_DATASOURCE_PASSWORD  = <contraseña>
quarkus.datasource.db-kind=postgresql
# Pocas conexiones: el plan gratuito de Render tiene 512 MB y Neon limita conexiones.
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=15S

# Desarrollo (mvn quarkus:dev) y pruebas: H2 en memoria en modo PostgreSQL,
# así no hace falta instalar nada para trabajar en local.
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:sierrasur;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:sierrasur;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

# Perfil "pg": pruebas contra un PostgreSQL real que levanta Quarkus Dev Services
# en Docker (lo usa la CI: mvn verify -Dquarkus.test.profile=pg).
%pg.quarkus.datasource.db-kind=postgresql

# El esquema y los datos iniciales los crea Flyway (src/main/resources/db/migration).
# Hibernate ya no genera tablas. Las migraciones que dependen del motor (p. ej. cambiar
# un CHECK cuyo nombre lo pone la base) van en db/postgresql y db/h2.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration,db/postgresql
%dev.quarkus.flyway.locations=db/migration,db/h2
%test.quarkus.flyway.locations=db/migration,db/h2
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=false

# --- HTTP ----------------------------------------------------------------
# Render asigna el puerto en la variable PORT; en local se usa 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# CORS: orígenes permitidos separados por coma. Un valor entre /.../ es una
# expresión regular. En Render se define CORS_ORIGINS con la URL de Cloudflare Pages.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# --- Panel de administración ---------------------------------------------
# Sesión: token JWT firmado con HMAC (HS256) que dura 8 horas. La llave sale de la
# variable JWT_SECRETO (en Render: valor aleatorio de al menos 32 caracteres; nunca en
# el repositorio). Si cambia, todas las sesiones abiertas se cierran.
sierrasur.jwt.secreto=${JWT_SECRETO}
%dev.sierrasur.jwt.secreto=c2llcnJhLXN1ci1lbi1saW5lYS1zb2xvLXBhcmEtZGVzYXJyb2xsbw
%test.sierrasur.jwt.secreto=c2llcnJhLXN1ci1lbi1saW5lYS1zb2xvLXBhcmEtZGVzYXJyb2xsbw
%pg.sierrasur.jwt.secreto=c2llcnJhLXN1ci1lbi1saW5lYS1zb2xvLXBhcmEtZGVzYXJyb2xsbw
sierrasur.jwt.llave={"kty":"oct","alg":"HS256","k":"${sierrasur.jwt.secreto}"}
smallrye.jwt.sign.key=${sierrasur.jwt.llave}
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.verify.secretkey=${sierrasur.jwt.llave}
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=sierrasurenlinea

# Cuenta del dueño: se crea sola la primera vez que arranca si todavía no hay dueño.
# En Render: ADMIN_CORREO y ADMIN_CONTRASENA (mínimo 10 caracteres).
sierrasur.admin.correo=${ADMIN_CORREO:}
sierrasur.admin.contrasena=${ADMIN_CONTRASENA:}
# Recuperar el acceso: con ADMIN_REINICIAR=true, al arrancar se pone ADMIN_CONTRASENA
# a la cuenta ADMIN_CORREO. Quita la variable después de entrar.
sierrasur.admin.reiniciar=${ADMIN_REINICIAR:false}
%dev.sierrasur.admin.correo=dueno@sierrasur.local
%dev.sierrasur.admin.contrasena=dueno-local-123
%test.sierrasur.admin.correo=dueno@sierrasur.local
%test.sierrasur.admin.contrasena=dueno-local-123
%pg.sierrasur.admin.correo=dueno@sierrasur.local
%pg.sierrasur.admin.contrasena=dueno-local-123

# Fotos en Cloudflare R2 (fase 3). Sin estas variables el panel no deja subir fotos.
# R2_CUENTA: id de la cuenta de Cloudflare; R2_LLAVE_ACCESO / R2_LLAVE_SECRETA: token de
# API de R2 (Object Read & Write); R2_BUCKET; R2_URL_PUBLICA: dominio público del bucket.
sierrasur.r2.cuenta=${R2_CUENTA:}
sierrasur.r2.llave-acceso=${R2_LLAVE_ACCESO:}
sierrasur.r2.llave-secreta=${R2_LLAVE_SECRETA:}
sierrasur.r2.bucket=${R2_BUCKET:}
sierrasur.r2.url-publica=${R2_URL_PUBLICA:}
%test.sierrasur.r2.cuenta=cuentaprueba
%test.sierrasur.r2.llave-acceso=AKIAIOSFODNN7EXAMPLE
%test.sierrasur.r2.llave-secreta=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
%test.sierrasur.r2.bucket=fotos-prueba
%test.sierrasur.r2.url-publica=https://fotos.ejemplo.mx
%test.sierrasur.r2.simular=true
%pg.sierrasur.r2.cuenta=cuentaprueba
%pg.sierrasur.r2.llave-acceso=AKIAIOSFODNN7EXAMPLE
%pg.sierrasur.r2.llave-secreta=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
%pg.sierrasur.r2.bucket=fotos-prueba
%pg.sierrasur.r2.url-publica=https://fotos.ejemplo.mx
%pg.sierrasur.r2.simular=true

# Pedidos en línea: máximo por IP cada 10 minutos (las pruebas hacen muchos).
%test.sierrasur.pedidos.limite=1000
%pg.sierrasur.pedidos.limite=1000

# --- Documentación de la API --------------------------------------------
quarkus.smallrye-openapi.info-title=Sierra Sur en Línea - API del catálogo
quarkus.swagger-ui.always-include=true
